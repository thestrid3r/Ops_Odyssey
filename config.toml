baseURL = "https://thestrid3r.github.io/Ops_Odyssey/"
languageCode = "en-us"
title = "Ops Odyssey"
theme = "FixIt"

# Enable Google Analytics
googleAnalytics = ""

# Enable Disqus comments
disqusShortname = ""

# FixIt theme configuration
[params]
  # Site description
  description = "Welcome to Ops Odyssey - Your DevOps Journey"
  
  # Site logo
  logo = ""
  
  # Theme color scheme
  colorScheme = "auto"  # auto, light, dark
  
  # Search configuration
  [params.search]
    enable = true
    type = "auto"  # auto, algolia, fuse
  
  # Social links
  [params.social]
    GitHub = ""
    Twitter = ""
    LinkedIn = ""
    Instagram = ""
    Facebook = ""
    YouTube = ""
  
  # Menu configuration
  [params.menu]
    [[params.menu.main]]
      identifier = "posts"
      name = "Posts"
      url = "/posts/"
      weight = 10
    [[params.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/tags/"
      weight = 20
    [[params.menu.main]]
      identifier = "categories"
      name = "Categories"
      url = "/categories/"
      weight = 30

# Author configuration
[author]
  name = "Your Name"
  email = ""
  link = ""
  avatar = ""
  gravatarEmail = ""
  bio = "DevOps Engineer and Cloud Enthusiast"
  location = ""
  company = ""
  [author.social]
    GitHub = ""
    Twitter = ""
    LinkedIn = ""
    Instagram = ""
    Facebook = ""
    YouTube = ""

# Default author for all content
[params.authors]
  [params.authors.default]
    name = "Your Name"
    email = ""
    link = ""
    avatar = ""
    gravatarEmail = ""
    bio = "DevOps Engineer and Cloud Enthusiast"
    location = ""
    company = ""
    [params.authors.default.social]
      GitHub = ""
      Twitter = ""
      LinkedIn = ""
      Instagram = ""
      Facebook = ""
      YouTube = "" 